<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes Recibidos - Mi Proyecto Web</title>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; }
        header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        nav { background-color: #34495e; padding: 10px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { color: #1abc9c; }
        .contenedor { padding: 20px; max-width: 800px; margin: auto; }

        /* Contador de mensajes */
        .contador {
            background-color: #1abc9c;
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Tarjeta de cada mensaje */
        .tarjeta {
            background-color: white;
            border-left: 5px solid #1abc9c;
            border-radius: 5px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .tarjeta .nombre {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.1em;
        }

        .tarjeta .fecha {
            color: #888;
            font-size: 0.85em;
            margin-top: 3px;
        }

        .tarjeta .texto {
            margin-top: 10px;
            line-height: 1.5;
        }

        /* Estados: cargando, vacío y error */
        .estado {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .estado.error { color: #c0392b; }

        /* Botón de recargar */
        .boton-recargar {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }
        .boton-recargar:hover { background-color: #1abc9c; }
    </style>
</head>
<body>

    <header>
        <h1>📬 Mensajes Recibidos</h1>
    </header>

    <nav>
        <a href="index.html">Página Principal</a>
        <a href="sobre-mi.html"> mi yo!</a>
        <a href="mensajes.html">Mensajes</a>
    </nav>

    <div class="contenedor">
        <h2>Esto es lo que la gente ha escrito:</h2>

        <button class="boton-recargar" onclick="cargarMensajes()">🔄 Recargar</button>
        <span class="contador" id="contador" style="display:none;"></span>

        <!-- Aquí se van a mostrar las tarjetas -->
        <div id="lista">
            <div class="estado">Cargando mensajes...</div>
        </div>
    </div>

    <script>
        // Pide los mensajes a /api/mensajes y los dibuja como tarjetas
        async function cargarMensajes() {
            const lista = document.getElementById('lista');
            const contador = document.getElementById('contador');

            lista.innerHTML = '<div class="estado">Cargando mensajes...</div>';
            contador.style.display = 'none';

            try {
                const respuesta = await fetch('/api/mensajes');
                if (!respuesta.ok) throw new Error('Respuesta no válida');

                const mensajes = await respuesta.json();

                // Si no hay mensajes todavía
                if (mensajes.length === 0) {
                    lista.innerHTML = '<div class="estado">Todavía no hay mensajes. ¡Sé el primero en escribir uno!</div>';
                    return;
                }

                // Ordenamos del más reciente al más antiguo
                mensajes.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

                // Mostramos el contador
                contador.textContent = mensajes.length + (mensajes.length === 1 ? ' mensaje' : ' mensajes');
                contador.style.display = 'inline-block';

                // Creamos una tarjeta por cada mensaje
                lista.innerHTML = '';
                for (const m of mensajes) {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta';

                    // Formateamos la fecha a algo legible en español
                    const fecha = new Date(m.fecha).toLocaleString('es-ES', {
                        day: 'numeric', month: 'long', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });

                    // Usamos textContent para que el texto se muestre seguro
                    const nombre = document.createElement('div');
                    nombre.className = 'nombre';
                    nombre.textContent = '👤 ' + m.nombre;

                    const fechaDiv = document.createElement('div');
                    fechaDiv.className = 'fecha';
                    fechaDiv.textContent = fecha;

                    const texto = document.createElement('div');
                    texto.className = 'texto';
                    texto.textContent = m.mensaje;

                    tarjeta.appendChild(nombre);
                    tarjeta.appendChild(fechaDiv);
                    tarjeta.appendChild(texto);
                    lista.appendChild(tarjeta);
                }

            } catch (error) {
                lista.innerHTML = '<div class="estado error">❌ No se pudieron cargar los mensajes. Intenta recargar.</div>';
            }
        }

        // Cargamos los mensajes apenas se abre la página
        cargarMensajes();
    </script>

</body>
</html>
