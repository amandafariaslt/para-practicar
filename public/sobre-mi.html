<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Mí - Mi Proyecto Web</title>

    <!-- Usamos los mismos estilos para mantener el diseño -->
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; }
        header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        nav { background-color: #34495e; padding: 10px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { color: #1abc9c; }
        .contenedor { padding: 20px; max-width: 800px; margin: auto; }

        /* Estilo extra para un formulario sencillo */
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        /* Mensaje de confirmación (oculto al inicio) */
        #resultado {
            display: none;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
        }
        #resultado.ok { display: block; background-color: #d4edda; color: #155724; }
        #resultado.error { display: block; background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <header>
        <h1>Cambio titulos</h1>
    </header>

    <nav>
        <a href="index.html">Página Principal</a>
        <a href="sobre-mi.html"> mi yo!</a>
    </nav>

    <div class="contenedor">
        <h2>Hola, sigo modificando a ver si funciona</h2>
        <p>Aquí puedes poner información diferente. Ahora el formulario guarda los datos de verdad en Cloudflare.</p>

        <h3>Déjame un mensaje:</h3>
        <form id="formulario">
            <label for="nombre">Tu Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre aquí" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe un mensaje..." required></textarea>

            <button type="submit" style="background-color: #2c3e50; color: white; padding: 10px 20px; border: none; cursor: pointer;">Enviar Mensaje</button>
        </form>

        <!-- Aquí aparece la confirmación después de enviar -->
        <div id="resultado"></div>
    </div>

    <script>
        // Interceptamos el envío del formulario para mandarlo a nuestra función de Cloudflare
        document.getElementById('formulario').addEventListener('submit', async function (evento) {
            evento.preventDefault(); // Evita que la página se recargue

            const nombre = document.getElementById('nombre').value;
            const mensaje = document.getElementById('mensaje').value;
            const resultado = document.getElementById('resultado');

            try {
                // Enviamos los datos a la función que vive en /functions/api/guardar.js
                const respuesta = await fetch('/api/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombre, mensaje: mensaje })
                });

                if (respuesta.ok) {
                    resultado.className = 'ok';
                    resultado.textContent = '✅ ¡Mensaje guardado con éxito!';
                    this.reset(); // Limpia el formulario
                } else {
                    resultado.className = 'error';
                    resultado.textContent = '❌ Hubo un error al guardar. Intenta de nuevo.';
                }
            } catch (error) {
                resultado.className = 'error';
                resultado.textContent = '❌ No se pudo conectar con el servidor.';
            }
        });
    </script>

</body>
</html>
