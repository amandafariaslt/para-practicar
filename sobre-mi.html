<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Mí - Mi Proyecto Web</title>
    
    <!-- Usamos los mismos estilos para mantener el diseño -->
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; }
        header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        nav { background-color: #34495e; padding: 10px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { color: #1abc9c; }
        .contenedor { padding: 20px; max-width: 800px; margin: auto; }
        
        /* Estilo extra para un formulario sencillo */
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cambio titulos</h1>
    </header>

    <nav>
        <a href="index.html">Página Principal</a>
        <a href="sobre-mi.html"> mi yo!</a>
    </nav>

    <div class="contenedor">
        <h2>Hola, sigo modificando a ver si funciona</h2>
        <p>Aquí puedes poner información diferente. Como reto adicional, he incluido un formulario de contacto falso.</p>
        
        <!-- EDITAR AQUÍ: Un formulario básico de prueba -->
        <h3>Déjame un mensaje:</h3>
        <form action="#" method="get">
            <label for="nombre">Tu Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre aquí">

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe un mensaje...Es solo una prueba"></textarea>

            <button type="submit" style="background-color: #2c3e50; color: white; padding: 10px 20px; border: none; cursor: pointer;">Enviar Mensaje</button>
        </form>
    </div>

</body>
